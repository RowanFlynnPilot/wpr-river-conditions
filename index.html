    <!-- JSON-LD structured data — injected at build by scripts/inject-seo.mjs -->
    <!-- SEO:JSONLD -->

    <!-- Google Analytics 4 — captures pageviews AND the custom events fired by
         src/utils/analytics.js (sponsor_click, gauge_map_open, gauge_filter, etc.).
         Skips localhost/127.0.0.1 so dev & preview sessions don't pollute the data. -->
    <script>
      (function () {
        var GA4_ID = 'G-XXXXXXXXXX'; // ← PASTE YOUR GA4 MEASUREMENT ID HERE
        var h = location.hostname;
        if (!GA4_ID || GA4_ID === 'G-XXXXXXXXXX' || h === 'localhost' || h === '127.0.0.1') return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA4_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', GA4_ID);
      })();
    </script>
