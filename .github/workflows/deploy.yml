name: Fetch Data & Deploy

on:
  # Primary trigger: the Cloudflare Worker in infra/dispatch-worker fires
  # workflow_dispatch every 30 minutes. GitHub's own scheduler delivered
  # ~6 of 38 configured runs a day (measured Aug-Oct 2026), so the cron below
  # is only a fallback for when the worker is down.
  schedule:
    - cron: '7,37 10-23 * * *'
    - cron: '7,37 0-4 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # keepalive step re-enables this workflow

# cancel-in-progress false so a deploy in flight always completes — a cancel
# can land after the WP post updates but before Pages deploys, leaving the
# article and widget describing different conditions.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # GitHub disables scheduled workflows after 60 days without a commit —
      # that froze the live site for 25 days in Oct 2026. Calling the enable
      # endpoint resets that clock, so every run keeps the workflow alive.
      - name: Keep workflow enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Fetch river data
        env:
          # Optional api.data.gov key for the USGS Water Data APIs. Without
          # it requests are anonymous and share a small per-IP quota.
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: python3 scripts/fetch_data.py

      - name: Publish report to WordPress
        # No-ops gracefully if the WP_* secrets aren't configured.
        # Non-fatal: a WordPress outage must not block the Pages deploy —
        # the widget's data refresh is the primary product.
        continue-on-error: true
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_POST_SLUG: ${{ secrets.WP_POST_SLUG }}
          WP_POST_STATUS: ${{ secrets.WP_POST_STATUS }}
          WP_CATEGORY_ID: ${{ secrets.WP_CATEGORY_ID }}
        run: python3 scripts/publish_to_wordpress.py

      - name: Copy data to public dir for build
        run: |
          mkdir -p public/data
          cp src/data/river-data.json public/data/river-data.json
          cp src/data/daily-summary.html public/data/daily-summary.html
          cp src/data/daily-summary.json public/data/daily-summary.json

      - name: Build
        run: npm run build

      - name: Copy data to dist
        run: |
          cp src/data/river-data.json dist/data/river-data.json
          cp src/data/daily-summary.html dist/data/daily-summary.html
          cp src/data/daily-summary.json dist/data/daily-summary.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # deploy-pages sometimes runs a second after the upload and is told
      # "No artifacts named github-pages were found" even though the upload
      # succeeded (twice on 2026-11-22; a re-run fixed both). Nobody is there
      # to re-run a scheduled job, so wait and try once more. The job still
      # fails if the second attempt does.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
