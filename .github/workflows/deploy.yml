name: Fetch Data & Deploy

on:
  schedule:
    # Offset from :00/:30 — GitHub's scheduler drops on-the-hour crons first
    # under load, which was causing multi-hour gaps between runs.
    - cron: '7,37 10-23 * * *'
    - cron: '7,37 0-4 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress false so a deploy in flight always completes — a cancel
# can land after the WP post updates but before Pages deploys, leaving the
# article and widget describing different conditions.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Fetch river data
        run: python3 scripts/fetch_data.py

      - name: Publish report to WordPress
        # No-ops gracefully if the WP_* secrets aren't configured.
        # Non-fatal: a WordPress outage must not block the Pages deploy —
        # the widget's data refresh is the primary product.
        continue-on-error: true
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_POST_SLUG: ${{ secrets.WP_POST_SLUG }}
          WP_POST_STATUS: ${{ secrets.WP_POST_STATUS }}
          WP_CATEGORY_ID: ${{ secrets.WP_CATEGORY_ID }}
        run: python3 scripts/publish_to_wordpress.py

      - name: Copy data to public dir for build
        run: |
          mkdir -p public/data
          cp src/data/river-data.json public/data/river-data.json
          cp src/data/daily-summary.html public/data/daily-summary.html
          cp src/data/daily-summary.json public/data/daily-summary.json

      - name: Build
        run: npm run build

      - name: Copy data to dist
        run: |
          cp src/data/river-data.json dist/data/river-data.json
          cp src/data/daily-summary.html dist/data/daily-summary.html
          cp src/data/daily-summary.json dist/data/daily-summary.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
